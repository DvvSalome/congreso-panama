<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Networking profesional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3566"/>
      <stop offset=".55" stop-color="#1d2549"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#e8b447" stop-opacity=".32"/>
      <stop offset=".7" stop-color="#e8b447" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6cf6b"/>
      <stop offset="1" stop-color="#c58e28"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e8b447" opacity=".10"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#dots)"/>
  <rect width="800" height="480" fill="url(#glow)"/>
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M400 240 250 150"/>
    <path d="M400 240 560 152"/>
    <path d="M400 240 224 340"/>
    <path d="M400 240 578 336"/>
    <path d="M250 150 560 152"/>
    <path d="M224 340 578 336"/>
  </g>
  <g fill="#0a0f22" stroke="url(#gold)" stroke-width="6">
    <circle cx="250" cy="150" r="26"/>
    <circle cx="560" cy="152" r="26"/>
    <circle cx="224" cy="340" r="26"/>
    <circle cx="578" cy="336" r="26"/>
  </g>
  <circle cx="400" cy="240" r="34" fill="url(#gold)"/>
</svg>
